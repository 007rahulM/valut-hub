    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Sendly",
      "url": "https://sendly.app/",
      "applicationCategory": "SecurityApplication",
      "operatingSystem": "Any",
      "description": "Private file sharing with browser-side encryption and links that expire automatically. No account needed.",
      "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
      "featureList": [
        "Encryption in the browser with AES-GCM",
        "Share links that expire after 1 day or 10 downloads",
        "Optional password protection",
        "No account required",
        "Automatic permanent deletion",
        "We never scan files and never train AI on them"
      ]
    }
    </script>
