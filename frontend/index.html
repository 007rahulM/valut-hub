<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary -->
    <title>VaultHub: simple, private file sharing</title>
    <meta name="description" content="Share files up to 500 MB with a link that expires automatically. Free, no account needed. Files are deleted after 1 day or 10 downloads." />
    <meta name="author" content="VaultHub" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#E8501E" />
    <meta name="application-name" content="VaultHub" />
    <link rel="canonical" href="https://valut-hub.vercel.app/" />
    <link rel="icon" type="image/svg+xml" href="/illustrations/icon.svg" />

    <!-- Open Graph (previews in WhatsApp, LinkedIn, Facebook, Discord) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="VaultHub" />
    <meta property="og:title" content="VaultHub: simple, private file sharing" />
    <meta property="og:description" content="Share files with a link that expires automatically. No account needed. Files are deleted after 1 day or 10 downloads." />
    <meta property="og:url" content="https://valut-hub.vercel.app/" />
    <meta property="og:image" content="https://valut-hub.vercel.app/logo.png" />
    <meta property="og:image:alt" content="VaultHub logo, a cloud with a lock" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="VaultHub: simple, private file sharing" />
    <meta name="twitter:description" content="Share files with a link that expires automatically. No account needed." />
    <meta name="twitter:image" content="https://valut-hub.vercel.app/logo.png" />

    <!-- Structured data (Google rich results) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "VaultHub",
      "url": "https://valut-hub.vercel.app/",
      "applicationCategory": "SecurityApplication",
      "operatingSystem": "Any",
      "description": "Free file sharing with encryption in your browser and links that expire automatically. No account needed.",
      "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
      "featureList": [
        "Encryption in the browser with AES-GCM",
        "Share links that expire after 1 day or 10 downloads",
        "Optional password protection",
        "No account required",
        "Automatic permanent deletion",
        "We never scan files and never train AI on them"
      ]
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
