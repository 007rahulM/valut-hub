version: '3'

services:
  postgres:
    image: postgres:15
    container_name: vaulthub-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: vaulthub
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # ---- THIS FORCE-LIMITS THE MEMORY DIRECTLY ----
    mem_limit: 512m
    mem_reservation: 128m

volumes:
  postgres_data:
